<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mystery Neighbour Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            user-select: none;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', cursive;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .pop-in {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="bg-gradient-to-r from-teal-500 via-emerald-500 to-indigo-600 text-white p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-md">
                    <i class="fa-solid fa-user-ninja text-3xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold tracking-wide">Describe Our Neighbour!</h1>
                    <p class="text-xs md:text-sm text-teal-100">Interactive Primary ESL Vocabulary & Appearance Practice</p>
                </div>
            </div>

            <!-- Pronoun Toggle (He / She) -->
            <div class="flex items-center bg-white/10 p-1.5 rounded-2xl backdrop-blur-md border border-white/20 space-x-2">
                <span class="text-xs font-semibold uppercase tracking-wider px-2 text-teal-100">Pronoun:</span>
                <button id="btn-he" onclick="setPronoun('He')" class="px-5 py-1.5 rounded-xl font-bold transition-all bg-yellow-400 text-slate-900 shadow">He</button>
                <button id="btn-she" onclick="setPronoun('She')" class="px-5 py-1.5 rounded-xl font-bold transition-all text-white hover:bg-white/20">She</button>
            </div>
        </div>
    </header>

            <div>

                        <button onclick="toggleFeature('watch')" class="flex items-center space-x-2 flex-grow text-left">
                            <span class="text-lg">⌚</span>
                            <span class="font-bold text-sm text-slate-700">Watch</span>

                        <div class="flex items-center space-x-1">

        <!-- RIGHT PANEL: INTERACTIVE CHARACTER CANVAS & QUIZ CONTROLS -->

            <div class="relative w-full max-w-md bg-gradient-to-b from-sky-100 via-indigo-50 to-amber-50 rounded-3xl p-6 shadow-xl border-4 border-white flex flex-col items-center">
                
                <!-- Status Badge -->
                <div id="quiz-badge" class="hidden absolute top-4 left-4 bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-md animate-pulse z-10">

                </div>

                <!-- SVG Character Display Canvas -->
                <div class="w-full aspect-[4/5] relative flex justify-center items-center">
                    <svg id="character-canvas" viewBox="0 0 400 500" class="w-full h-full drop-shadow-md">
                        
                        <!-- Base Body Background & Shoulders -->

                        <circle cx="295" cy="200" r="18" fill="#e2e8f0"/>

                            <circle cx="240" cy="182" r="7" fill="#1e293b"/>
                            <circle cx="158" cy="179" r="2.5" fill="#ffffff"/>
                            <circle cx="238" cy="179" r="2.5" fill="#ffffff"/>

                            <path d="M 222,158 Q 240,150 258,158" stroke="#334155" stroke-width="4" stroke-linecap="round" fill="none"/>
                        </g>

                        <!-- Nose -->

                        <!-- Mouth / Smile -->
                        <path id="svg-mouth" d="M 170,250 Q 200,275 230,250" stroke="#e11d48" stroke-width="4.5" stroke-linecap="round" fill="none"/>

                        <!-- Standard Short Hair (He) -->

                            <circle cx="235" cy="212" r="2.5"/><circle cx="245" cy="205" r="2"/><circle cx="255" cy="210" r="2.5"/><circle cx="240" cy="220" r="2"/><circle cx="250" cy="218" r="2"/>

                        <g id="overlay-necklace" class="hidden pop-in">

                        <!-- Scarf Layer -->
                        <g id="overlay-scarf" class="hidden pop-in">

                        <g id="overlay-hat" class="hidden pop-in">

                    <button onclick="randomizeFeatures()" class="bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-900 font-bold p-3 rounded-2xl shadow-md transition-all flex flex-col items-center justify-center text-xs md:text-sm">
                        <i class="fa-solid fa-dice text-lg mb-1"></i>
                        <span>Randomize</span>
                    </button>

                    <button id="btn-quiz-mode" onclick="toggleQuizMode()" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold p-3 rounded-2xl shadow-md transition-all flex flex-col items-center justify-center text-xs md:text-sm">

                        <span id="quiz-btn-label">Secret Quiz</span>

                    <button onclick="resetCanvas()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold p-3 rounded-2xl shadow-md transition-all flex flex-col items-center justify-center text-xs md:text-sm">

                <div class="flex items-center justify-center space-x-2 text-amber-400 font-bold">

                    <span>Teacher's Answer Key</span>

    </main>

    <!-- DIRECT REAL PHOTO MODAL DIALOG -->
    <div id="photo-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-5 md:p-6 shadow-2xl border-4 border-teal-400 pop-in flex flex-col items-center text-center space-y-4 relative">
            
            <!-- Close Modal Button -->
            <button onclick="closePhoto()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 p-2 rounded-full w-9 h-9 flex items-center justify-center font-bold transition-all">
                ✕
            </button>

            <!-- Vocabulary Title & Speech Button -->
            <div class="flex items-center space-x-3 text-teal-700 font-bold text-2xl pt-1">
                <span id="modal-title">Mole</span>
                <button id="modal-audio-btn" onclick="speakCurrentModal()" title="Listen" class="bg-teal-100 hover:bg-teal-200 text-teal-800 p-2 rounded-xl text-base transition-all shadow-sm">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>

            <!-- Clean Photo Display Container -->
            <div class="w-full aspect-[4/3] rounded-2xl overflow-hidden bg-slate-100 border-2 border-slate-200 flex justify-center items-center shadow-inner relative">
                <img id="modal-img" src="" alt="Real vocabulary photo" class="w-full h-full object-cover">
            </div>

            <!-- Example ESL Sentence Banner -->
            <div id="modal-sentence" class="w-full bg-teal-50 border border-teal-200 text-teal-800 p-3 rounded-2xl text-xs md:text-sm font-semibold flex items-center justify-between">
                <span id="sentence-text">He has a mole on his cheek.</span>
                <button onclick="speakCurrentSentence()" class="text-teal-600 hover:text-teal-900 p-1">
                    <i class="fa-solid fa-volume-low text-sm"></i>
                </button>
            </div>

            <!-- Dismiss Button -->
            <button onclick="closePhoto()" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 rounded-2xl transition-all shadow-md text-base">
                Got it!
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-slate-100 border-t border-slate-200 p-3 text-center text-xs text-slate-500">
        Primary ESL Vocabulary Practice • Interactive Whiteboard Activity
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const activeFeatures = {
            freckles: false,
            mole: false,
            dimples: false,
            beard: false,
            moustache: false,
            glasses: false,
            sunglasses: false,
            necklace: false,
            earrings: false,
            watch: false,
            bracelet: false,
            hat: false,
            cap: false,
            scarf: false,
            belt: false
        };

        let currentPronoun = 'He';
        let isQuizMode = false;
        let currentModalItem = '';

        const featureDetails = {
            mole: {
                name: 'a Mole',
                photo: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=800&q=80',
                sentence: 'has a mole under the eye.'
            },
            bracelet: {
                name: 'a Bracelet',
                photo: 'https://images.unsplash.com/photo-1573408301185-9146fe634ad0?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing a bracelet on the wrist.'
            },
            freckles: {
                name: 'Freckles',
                photo: 'https://images.unsplash.com/photo-1542383133-359c93195a9d?auto=format&fit=crop&w=800&q=80',
                sentence: 'has freckles on the nose and cheeks.'
            },
            dimples: {
                name: 'Dimples',
                photo: 'https://images.unsplash.com/photo-1595152772835-219674b2a8a6?auto=format&fit=crop&w=800&q=80',
                sentence: 'has dimples when smiling.'
            },
            beard: {
                name: 'a Beard',
                photo: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=800&q=80',
                sentence: 'has a beard around the chin.'
            },
            moustache: {
                name: 'a Moustache',
                photo: 'https://images.unsplash.com/photo-1583195764036-6dc248ac07d9?auto=format&fit=crop&w=800&q=80',
                sentence: 'has a moustache above the lip.'
            },
            glasses: {
                name: 'Glasses',
                photo: 'https://images.unsplash.com/photo-1574258495973-f010dfbb5371?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing glasses to see clearly.'
            },
            sunglasses: {
                name: 'Sunglasses',
                photo: 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing cool sunglasses.'
            },
            necklace: {
                name: 'a Necklace',
                photo: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing a necklace.'
            },
            earrings: {
                name: 'Earrings',
                photo: 'https://images.unsplash.com/photo-1630019852942-f89202989a59?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing shiny earrings.'
            },
            watch: {
                name: 'a Watch',
                photo: 'https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing a watch on the wrist.'
            },
            hat: {
                name: 'a Hat',
                photo: 'https://images.unsplash.com/photo-1572307480813-ceb0e59d8325?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing a hat.'
            },
            cap: {
                name: 'a Cap',
                photo: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing a cap.'
            },
            scarf: {
                name: 'a Scarf',
                photo: 'https://images.unsplash.com/photo-1520903920243-00d872a2d1c9?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing a warm scarf.'
            },
            belt: {
                name: 'a Belt',
                photo: 'https://images.unsplash.com/photo-1624222247344-550fb60583dc?auto=format&fit=crop&w=800&q=80',
                sentence: 'is wearing a belt around the waist.'
            }
        };

        function toggleFeature(featureKey) {
            activeFeatures[featureKey] = !activeFeatures[featureKey];
            updateDisplay();
        }

        function setPronoun(pronoun) {
            currentPronoun = pronoun;
            
            const btnHe = document.getElementById('btn-he');
            const btnShe = document.getElementById('btn-she');
            const hairShort = document.getElementById('hair-style-short');
            const hairLong = document.getElementById('hair-style-long');

            if (pronoun === 'He') {
                btnHe.className = "px-5 py-1.5 rounded-xl font-bold transition-all bg-yellow-400 text-slate-900 shadow";
                btnShe.className = "px-5 py-1.5 rounded-xl font-bold transition-all text-white hover:bg-white/20";
                if (hairShort) hairShort.classList.remove('hidden');
                if (hairLong) hairLong.classList.add('hidden');
            } else {
                btnShe.className = "px-5 py-1.5 rounded-xl font-bold transition-all bg-yellow-400 text-slate-900 shadow";
                btnHe.className = "px-5 py-1.5 rounded-xl font-bold transition-all text-white hover:bg-white/20";
                if (hairShort) hairShort.classList.add('hidden');
                if (hairLong) hairLong.classList.remove('hidden');
            }

            if (isQuizMode) updateQuizAnswerKey();
        }

        function updateDisplay() {
            Object.keys(activeFeatures).forEach(key => {
                const isSelected = activeFeatures[key];
                const overlay = document.getElementById(`overlay-${key}`);
                const card = document.getElementById(`card-${key}`);

                if (overlay) {
                    if (isSelected) overlay.classList.remove('hidden');
                    else overlay.classList.add('hidden');
                }

                if (card) {
                    if (isSelected) {
                        card.classList.remove('bg-slate-50', 'border-slate-200');
                        card.classList.add('bg-teal-100', 'border-teal-500', 'shadow-sm');
                    } else {
                        card.classList.add('bg-slate-50', 'border-slate-200');
                        card.classList.remove('bg-teal-100', 'border-teal-500', 'shadow-sm');
                    }
                }
            });

            if (isQuizMode) updateQuizAnswerKey();
        }

        // Display simple clean photo modal dialog
        function showPhoto(key) {
            const item = featureDetails[key];
            if (!item) return;

            currentModalItem = key;

            const cleanTitle = item.name.replace(/^a\s+/i, '');
            document.getElementById('modal-title').textContent = cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1);
            
            const imgEl = document.getElementById('modal-img');
            imgEl.src = item.photo;

            document.getElementById('sentence-text').textContent = `${currentPronoun} ${item.sentence}`;

            document.getElementById('photo-modal').classList.remove('hidden');
            speakText(item.name);
        }

        function closePhoto() {
            document.getElementById('photo-modal').classList.add('hidden');
        }

        function speakCurrentModal() {
            if (currentModalItem && featureDetails[currentModalItem]) {
                speakText(featureDetails[currentModalItem].name);
            }
        }

        function speakCurrentSentence() {
            const text = document.getElementById('sentence-text').textContent;
            if (text) speakText(text);
        }

        function randomizeFeatures() {
            Object.keys(activeFeatures).forEach(key => {
                activeFeatures[key] = Math.random() < 0.35;
            });

            const keys = Object.keys(activeFeatures);
            if (!keys.some(k => activeFeatures[k])) {
                activeFeatures['glasses'] = true;
                activeFeatures['freckles'] = true;
            }

            updateDisplay();
        }

        function toggleQuizMode() {
            isQuizMode = !isQuizMode;
            const badge = document.getElementById('quiz-badge');
            const btnLabel = document.getElementById('quiz-btn-label');
            const answerPanel = document.getElementById('quiz-answer-panel');

            if (isQuizMode) {
                badge.classList.remove('hidden');
                answerPanel.classList.remove('hidden');
                btnLabel.textContent = "Exit Quiz";
                randomizeFeatures();
            } else {
                badge.classList.add('hidden');
                answerPanel.classList.add('hidden');
                btnLabel.textContent = "Secret Quiz";
            }
        }

        function updateQuizAnswerKey() {
            const activeList = [];
            Object.keys(activeFeatures).forEach(key => {
                if (activeFeatures[key]) {
                    activeList.push(featureDetails[key].name);
                }
            });

            const content = document.getElementById('quiz-answer-content');
            if (activeList.length === 0) {
                content.textContent = "No extra features selected.";
            } else {
                content.textContent = `${currentPronoun}: ` + activeList.join(', ');
            }
        }

        function resetCanvas() {
            Object.keys(activeFeatures).forEach(key => {
                activeFeatures[key] = false;
            });
            updateDisplay();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        window.onload = function() {
            updateDisplay();
        };
    </script>
</body>
</html>
